
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6a0dad">
  <title>Insta Army la internacional</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

  <div id="pantalla-inicio">
    <img src="./inicio.jpg" alt="Insta Army la internacional">
  </div>

  <main id="aplicacion" class="oculta">
    <button id="btnInstalar" class="boton-instalar" aria-label="Instalar Insta Army">
  <img src="./botondescarga.png" alt="Instalar aplicación">
</button>

<audio id="sonidoDescarga" src="./btnddescarga.mp3" preload="auto"></audio>

<section id="menu-credenciales">
  <h1></h1>
  <p>Elige tu credencial favorita 💜</p>

  <div id="lista-credenciales" class="lista-credenciales">
    <!-- Aquí aparecerán las 10 plantillas -->
  </div>
</section>

<section id="creador-credencial" class="oculta">
  <!-- Aquí construiremos después el creador de credenciales -->
</section>

<div id="vista-previa" class="modal-vista-previa oculta">
  <div class="contenido-vista-previa">
    <img id="imagen-vista-previa" src="" alt="Vista previa de la credencial">

    <div class="botones-vista-previa">
      <button id="btnCrearCredencial" type="button">CREAR</button>
      <button id="btnCerrarVista" type="button">CERRAR</button>
    </div>
  </div>
</div>

  </main>

 <script src="./app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Insta Army: aplicación preparada"))
        .catch((error) => console.error("Error al registrar:", error));
    });
  }
</script>

</body>
</html>
